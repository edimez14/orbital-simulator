# código nuevo edizon
# Servicio web gratuito en Render (https://render.com).
# Al conectar el repositorio, Render lee este archivo y despliega solo.

services:
  - type: web
    name: orbital-simulator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn src.wsgi:server --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
