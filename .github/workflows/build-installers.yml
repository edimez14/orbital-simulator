# código nuevo edizon
# ---------------------------------------------------------------------------
# Compila el instalador del simulador en los tres sistemas operativos.
#
# PyInstaller NO compila cruzado: el .exe de Windows debe generarse en Windows,
# el de macOS en macOS y el de Linux en Linux. Este workflow hace los tres.
#
# Se ejecuta:
#   - A mano, desde la pestana "Actions" de GitHub (workflow_dispatch).
#   - Automaticamente al subir una etiqueta que empiece por "v" (por ejemplo
#     v0.1.0).
# ---------------------------------------------------------------------------
name: build-installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      # Un trabajo por sistema operativo.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compilar el ejecutable
        run: pyinstaller orbital_simulator.spec

      - name: Publicar el resultado
        uses: actions/upload-artifact@v4
        with:
          name: orbital-simulator-${{ matrix.os }}
          path: dist/
